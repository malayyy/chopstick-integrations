<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030303">
  <title>Chopstick</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:#030303;overflow-x:hidden}
    body{overscroll-behavior-y:none}
    #scroll-track{height:500vh;position:relative}
    #stage{position:sticky;top:0;width:100%;height:100svh;height:100dvh;overflow:hidden;background:#030303}
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
    #loader{position:absolute;inset:0;display:grid;place-items:center;background:#030303;transition:opacity .45s ease;pointer-events:none}
    #loader.hidden{opacity:0}
    #loader span{width:34px;height:34px;border:1px solid rgba(255,255,255,.14);border-top-color:#c51e3a;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){#loader span{animation:none}}
  </style>
</head>
<body>
  <main id="scroll-track" aria-label="Chopstick cinematic animation">
    <div id="stage">
      <canvas id="sequence" aria-label="Cinematic Chopstick animation"></canvas>
      <div id="loader"><span></span></div>
    </div>
  </main>
  <script>
    (() => {
      const TOTAL = 300;
      const canvas = document.getElementById('sequence');
      const ctx = canvas.getContext('2d', { alpha:false, desynchronized:true });
      const track = document.getElementById('scroll-track');
      const loader = document.getElementById('loader');
      const cache = new Map();
      const pending = new Map();
      let target = 0, current = 0, lastDrawn = -1, raf = 0, ready = false;
      let width = 0, height = 0, dpr = 1;

      const src = i => './frames/frame-' + String(i + 1).padStart(3,'0') + '.webp';
      function load(i) {
        i = Math.max(0, Math.min(TOTAL - 1, i));
        if (cache.has(i)) return Promise.resolve(cache.get(i));
        if (pending.has(i)) return pending.get(i);
        const task = new Promise((resolve,reject) => {
          const img = new Image();
          img.decoding = 'async';
          img.onload = async () => {
            try { if (img.decode) await img.decode(); cache.set(i,img); trim(); resolve(img); }
            catch(e) { reject(e); }
          };
          img.onerror = () => reject(new Error('Unable to load frame ' + (i + 1)));
          img.src = src(i);
        }).finally(() => pending.delete(i));
        pending.set(i,task);
        return task;
      }
      function trim() {
        if (cache.size <= 10) return;
        for (const key of cache.keys()) {
          if (Math.abs(key - Math.round(current)) > 5 && cache.size > 10) cache.delete(key);
        }
      }
      function resize() {
        const rect = canvas.getBoundingClientRect();
        width = Math.max(1,rect.width); height = Math.max(1,rect.height);
        dpr = Math.min(window.devicePixelRatio || 1,2);
        canvas.width = Math.round(width*dpr);
        canvas.height = Math.round(height*dpr);
        ctx.setTransform(dpr,0,0,dpr,0,0);
        draw();
      }
      function drawImageCover(img,alpha=1) {
        if (!img) return;
        const scale = Math.max(width/img.naturalWidth,height/img.naturalHeight);
        const w = img.naturalWidth*scale, h = img.naturalHeight*scale;
        const x = (width-w)*.5, y = (height-h)*.5;
        ctx.globalAlpha = alpha;
        ctx.drawImage(img,x,y,w,h);
        ctx.globalAlpha = 1;
      }
      function draw() {
        if (!width || !height) return;
        const a = Math.max(0,Math.min(TOTAL-1,Math.floor(current)));
        const b = Math.min(TOTAL-1,a+1);
        const first = cache.get(a);
        const second = cache.get(b);
        ctx.fillStyle = '#030303';
        ctx.fillRect(0,0,width,height);
        if (first) drawImageCover(first);
        if (second && b !== a) drawImageCover(second,current-a);
        if (first) lastDrawn = a;
      }
      function updateTarget() {
        const maxScroll = Math.max(1,track.offsetHeight-window.innerHeight);
        target = Math.max(0,Math.min(1,window.scrollY/maxScroll))*(TOTAL-1);
        requestFrames(Math.round(target));
        if (!raf) raf = requestAnimationFrame(tick);
      }
      function requestFrames(i) {
        load(i).then(() => { if(!ready){ready=true;loader.classList.add('hidden');} }).catch(console.error);
        load(Math.min(TOTAL-1,i+1)).catch(()=>{});
        load(Math.max(0,i-1)).catch(()=>{});
      }
      function tick() {
        const delta = target-current;
        current += delta * (Math.abs(delta) < .08 ? 1 : .22);
        if (Math.abs(target-current) < .015) current = target;
        const frame = Math.floor(current);
        if (frame !== lastDrawn || Math.abs(delta) > .015) draw();
        requestFrames(Math.round(current));
        if (Math.abs(target-current) > .015) raf = requestAnimationFrame(tick);
        else raf = 0;
      }
      window.addEventListener('scroll',updateTarget,{passive:true});
      window.addEventListener('resize',resize,{passive:true});
      window.addEventListener('pageshow',updateTarget);
      resize();
      load(0).then(() => {
        current=0; target=0; draw(); ready=true; loader.classList.add('hidden');
        load(1).catch(()=>{});
      }).catch(err => { console.error(err); });
    })();
  </script>
</body>
</html>
