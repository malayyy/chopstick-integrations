name: Deploy Chopstick website (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Gather complete static website
        run: |
          mkdir -p _site
          cp index.html _site/
          for dir in assets work frames; do
  if [ -d "$dir" ]; then cp -R "$dir" _site/; fi
done
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
