<!doctype html>
<!--
  CHOPSTICK — INTEGRATIONS
  A single-file, scroll-controlled cinematic experience.
  300 x 4K UHD frames · WebGL2 full-bleed renderer · native scroll · zero dependencies
  Architecture and tuning notes: README.md
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050206">
<meta name="description" content="A scroll-controlled cinematic experience.">
<title>CHOPSTICK — INTEGRATIONS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23050206'/%3E%3Cpath d='M14 50 46 18M22 52 50 26' stroke='%23c8102e' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  html {
    margin: 0;
    padding: 0;
    background: #050206;
    text-size-adjust: 100%;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: none;
    scrollbar-width: none;               /* Firefox — the film is the interface */
  }
  html::-webkit-scrollbar { display: none; } /* WebKit */
  body {
    margin: 0;
    padding: 0;
    background: #050206;
    overscroll-behavior-y: none;
  }

  /* The stage is fixed and fills the viewport edge-to-edge at all times.
     The scroll track (#track) sits beneath it and provides scroll distance. */
  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
    opacity: 0;                           /* boot fades this in */
    transition: opacity 0.9s ease;
  }
  #track {
    position: relative;
    z-index: -1;
    width: 100%;
    height: 300svh;                       /* replaced with an exact px height by JS */
    background: #050206;
  }

  /* Graceful path for browsers without WebGL2: a plain letterboxed <img>,
     still driven by scroll. The full experience requires WebGL2. */
  #stage-fallback {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #050206;
    opacity: 0;
    transition: opacity 0.9s ease;
  }
  #stage-fallback.on { opacity: 1; }

  /* Boot veil: pure black with a single crimson hairline. No text. */
  #boot {
    position: fixed;
    inset: 0;
    z-index: 5;
    background: #050206;
    display: grid;
    place-items: center;
    opacity: 1;
    transition: opacity 0.45s ease;
    pointer-events: none;
  }
  #boot-bar {
    width: 0%;
    max-width: 220px;
    height: 2px;
    border-radius: 1px;
    background: #c8102e;
    box-shadow: 0 0 12px rgba(200, 16, 46, 0.55);
    transition: width 0.28s ease, opacity 0.45s ease;
  }
  #boot.done { opacity: 0; }
  #boot.done #boot-bar { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    #stage, #stage-fallback { transition-duration: 0.01s; }
  }
</style>
</head>
<body>
  <canvas id="stage" role="presentation" aria-hidden="true"></canvas>
  <img id="stage-fallback" alt="" draggable="false" hidden>
  <div id="track" aria-hidden="true"></div>
  <div id="boot" aria-hidden="true"><div id="boot-bar"></div></div>

<script type="module">
/* ============================================================================
   CHOPSTICK — INTEGRATIONS · cinematic scroll film engine
   ----------------------------------------------------------------------------
   Scroll position is the single source of truth. scrollY maps to the film
   index, smoothed with a frame-rate-independent exponential approach. The GPU
   renders a blended pair of adjacent frames, and a seamless shader edge
   extension fills any viewport margin so the plate always fills the screen
   without ever cropping the subject.

   Runtime dependencies: none.
============================================================================ */

/* ------------------------------- CONFIG --------------------------------- */
const CONFIG = Object.freeze({
  FRAME_COUNT: 300,
  SOURCE_W: 3840,
  SOURCE_H: 2160,

  /* Scroll distance (px) the film travels beyond the first viewport. */
  SCROLL_DIST_MIN: 1600,
  SCROLL_DIST_VH: 2.8,          // multiple of viewport height
  SCROLL_DIST_MAX: 4200,

  /* Input smoothing (1/s). Higher = snappier, lower = heavier cinematic lag. */
  SMOOTH_LAMBDA: 11.0,
  SETTLE_EPSILON: 0.0008,       // frames; below this the engine stops drawing

  /* Loading */
  BOOT_RING: 7,                 // frames decoded before the film is revealed
  PREFETCH_LANES: 2,            // concurrent out-of-boot decodes
  PREFETCH_AHEAD: 12,           // frames prefetched beyond the playhead (scroll direction)
  PREFETCH_BEHIND: 8,           // frames kept behind it (for immediate reversal)
  IDLE_FREEZE_MS: 6000,         // freeze ambient drift after this idle time

  /* Texture memory. Bitmaps are rescaled at decode to what the viewport can
     display, so mobile devices never hold 4K RGBA textures. Budgets are sized
     to actually hold the prefetch window without evict-churn:
     desktop ~25MB/frame @2880 -> ~22 frames in 560MB; mobile ~3-10MB/frame. */
  BUDGET_MB_MOBILE: 220,
  BUDGET_MB_DESKTOP: 560,
  UPLOAD_CAP_MOBILE: 1800,      // max source width uploaded on touch devices
  UPLOAD_CAP_DESKTOP: 3456,     // ...on desktop (masters stay 4K in repo)
  DPR_CAP: 2.5,

  /* Composition: contain, never crop. Leftover margins on non-16:9 viewports
     are filled by shader edge-extension plus a restrained procedural crimson
     atmosphere. BAND_ANCHOR positions the band on viewports with vertical
     margins (portrait), keeping the hand near the upper third. */
  BAND_ANCHOR_Y: [[0, 0.45], [160, 0.485], [299, 0.5]],
  SUBJECT_BAND_Y: 0.45,         // subject's vertical position within the plate
  EDGE_FADE_MIN: 120,           // px of the darkest edge falloff, minimum
  EDGE_FADE_MAX: 660,
  EDGE_FADE_RATIO: 0.45,        // of the margin on that axis

  /* Ambient layers (inside extension zones only) */
  MIST_AMPLITUDE: 0.085,
  SPARK_AMPLITUDE: 0.22,
  GRAIN: 1.35 / 255,
});

/* ----------------------------- UTILITIES -------------------------------- */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const isMobileLike = matchMedia('(pointer: coarse)').matches;
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const frameUrl = (i) =>
  `frames/ezgif-frame-${String(i + 1).padStart(3, '0')}.webp`;

/* Where the film band sits vertically, on viewports with vertical margins.
   Linear across keyframes; the hand in the early frames sits a touch high. */
function bandAnchorY(f) {
  const K = CONFIG.BAND_ANCHOR_Y;
  for (let s = 0; s < K.length - 1; s++) {
    const [f0, v0] = K[s], [f1, v1] = K[s + 1];
    if (f <= f1) return lerp(v0, v1, clamp((f - f0) / (f1 - f0), 0, 1));
  }
  return K[K.length - 1][1];
}

const canvas = document.getElementById('stage');
const fallbackImg = document.getElementById('stage-fallback');
const bootVeil = document.getElementById('boot');
const bootBar = document.getElementById('boot-bar');
const track = document.getElementById('track');

/* Start every load at the first frame (the film always plays from its head). */
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
scrollTo(0, 0);

const gl = canvas.getContext('webgl2', {
  alpha: false, antialias: false, depth: false, stencil: false,
  premultipliedAlpha: false, preserveDrawingBuffer: false,
  powerPreference: 'high-performance', desynchronized: false,
});

if (!gl) startFallback();
else startFilm(gl);

/* ==================================================================
   FALLBACK — no WebGL2. Static image, still scroll-locked.
================================================================== */
function startFallback() {
  bootVeil.remove();
  fallbackImg.hidden = false;
  fallbackImg.src = frameUrl(0);
  requestAnimationFrame(() => fallbackImg.classList.add('on'));

  const distance = () => clamp(window.innerHeight * CONFIG.SCROLL_DIST_VH,
    CONFIG.SCROLL_DIST_MIN, CONFIG.SCROLL_DIST_MAX);
  const sizeTrack = () => {
    const clientH = document.documentElement.clientHeight;
    track.style.height = `${clientH + distance()}px`;
  };
  sizeTrack();
  const onResize = () => sizeTrack();
  addEventListener('resize', onResize, { passive: true });
  if (window.visualViewport) visualViewport.addEventListener('resize', onResize);

  let raf = 0, last = -1;
  const tick = () => {
    raf = requestAnimationFrame(tick);
    const y = Math.max(0, scrollY);
    const max = Math.max(1, document.documentElement.scrollHeight -
                             document.documentElement.clientHeight);
    const i = clamp(Math.round(y / max * (CONFIG.FRAME_COUNT - 1)), 0, CONFIG.FRAME_COUNT - 1);
    if (i !== last) { last = i; fallbackImg.src = frameUrl(i); }
  };
  raf = requestAnimationFrame(tick);
}

/* ==================================================================
   FILM ENGINE
================================================================== */
function startFilm(gl) {
  const SRC_W = CONFIG.SOURCE_W, SRC_H = CONFIG.SOURCE_H;
  const N = CONFIG.FRAME_COUNT;

  /* ------------------------------ SHADERS -------------------------------- */
  const VERT = `#version 300 es
layout(location=0) in vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }`;

  /* One program draws the film plate and extends its edges to fill the whole
     viewport. Inside the plate: pure footage. Outside: the plate's edge is
     continued with a soft smear that fades to the environment, lifted by a
     restrained procedural crimson atmosphere and unified by film grain. */
  const FRAG = `#version 300 es
precision highp float;

uniform sampler2D uTex;
uniform vec2  uCanvas;    // backing store size (device px)
uniform vec2  uOffset;    // film band top-left (device px)
uniform vec2  uDisp;      // film band size (device px)
uniform vec2  uFade;      // per-axis edge-falloff distance (device px)
uniform float uAlpha;     // this frame's blend weight
uniform float uTime;      // ambient clock
uniform float uAmbient;   // 0/1 atmosphere gate
uniform float uMotion;    // 0 = prefers-reduced-motion
uniform float uSeed;      // per-second grain seed

out vec4 fragColor;

const vec3 CRIMSON = vec3(0.62, 0.035, 0.062);
const vec3 LUMA    = vec3(0.2126, 0.7152, 0.0722);
const float GRAIN  = ${CONFIG.GRAIN.toFixed(6)};
const float MIST_A = ${CONFIG.MIST_AMPLITUDE.toFixed(4)};
const float SPARK_A = ${CONFIG.SPARK_AMPLITUDE.toFixed(4)};

float hash21(vec2 p){
  p = fract(p * vec2(127.1, 311.7));
  p += dot(p, p + 34.23);
  return fract(p.x * p.y);
}
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(hash21(i),                  hash21(i + vec2(1.0, 0.0)), u.x),
    mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), u.x), u.y);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 3; i++){ v += a * vnoise(p); p = p * 2.13 + 11.7; a *= 0.5; }
  return v;
}

/* The plate's edge sample, blurred along the perpendicular axis in ~2px taps.
   axis: 0.0 = X-margin (smear along Y), 1.0 = Y-margin (smear along X). */
vec3 edgeSample(vec2 cuv, vec2 disp, float axis){
  vec2 dir = axis < 0.5 ? vec2(0.0, 1.0) : vec2(1.0, 0.0);
  vec3 acc = vec3(0.0);
  float wsum = 0.0;
  for (int k = 0; k < 5; k++){
    float w = exp(-abs(float(k - 2)) * 0.62);
    vec2 uv = cuv + dir * (float(k - 2) * 2.0) / disp;
    acc += texture(uTex, clamp(uv, vec2(0.0), vec2(1.0))).rgb * w;
    wsum += w;
  }
  return acc / wsum;
}

void main(){
  /* WebGL's fragment origin is bottom-left; images upload top-down.
     Flip to a top-left pixel space so the plate and its extension math both
     work in natural image coordinates. */
  vec2 p = vec2(gl_FragCoord.x, uCanvas.y - gl_FragCoord.y) - uOffset;
  vec2 uv = p / uDisp;

  bool insideX = uv.x >= 0.0 && uv.x <= 1.0;
  bool insideY = uv.y >= 0.0 && uv.y <= 1.0;

  vec3 col;
  if (insideX && insideY) {
    col = texture(uTex, uv).rgb;
  } else {
    vec2 auv = clamp(uv, vec2(0.0), vec2(1.0));

    float dx = uv.x < 0.0 ? -p.x : (uv.x > 1.0 ? p.x - uDisp.x : 0.0);
    float dy = uv.y < 0.0 ? -p.y : (uv.y > 1.0 ? p.y - uDisp.y : 0.0);
    float fx = clamp(dx / max(uFade.x, 1.0), 0.0, 1.0);
    float fy = clamp(dy / max(uFade.y, 1.0), 0.0, 1.0);
    float dd = max(fx, fy);
    float keep = pow(1.0 - dd, 1.7);

    vec3 edge = edgeSample(auv, uDisp, insideX ? 0.0 : 1.0);
    col = edge * keep;

    if (uAmbient > 0.5 && dd > 0.02) {
      float edgeLuma  = dot(edge, LUMA);
      float bandMask  = smoothstep(0.02, 0.35, dd);

      /* slow crimson mist, graded by the plate's own edge luminance */
      vec2 q = gl_FragCoord.xy / min(uCanvas.x, uCanvas.y);
      float mist = fbm(q * 1.9 + vec2(0.0, uTime * 0.016));
      mist = smoothstep(0.58, 0.97, mist) * bandMask * edgeLuma * MIST_A;

      /* sparse drifting embers, two parallax heights */
      float sparks = 0.0;
      if (uMotion > 0.5) {
        for (int L = 0; L < 2; L++){
          float cell = L == 0 ? 96.0 : 160.0;
          vec2 id = floor(gl_FragCoord.xy / cell);
          float h = hash21(id * 1.37 + float(L) * 7.1 + 13.7);
          vec2 jitter = vec2(h, hash21(id + 3.71)) * 0.34;
          vec2 c = (id + 0.33 + jitter) * cell;
          c.y += uTime * (2.0 + 2.5 * h);              /* slow rise */
          float dist = length(gl_FragCoord.xy - c);
          float glow = (1.0 - smoothstep(1.0, cell * 0.052, dist)) * step(0.94, h);
          float tw = 0.55 + 0.45 * sin(uTime * (0.3 + 0.6 * h) + h * 40.0);
          sparks += glow * tw * (L == 0 ? 1.0 : 0.5);
        }
        sparks = clamp(sparks, 0.0, 1.0) * bandMask * SPARK_A;
      }

      col += CRIMSON * (mist + sparks);
    }
  }

  /* Unifying film grain, re-seeded each second (static under reduced motion). */
  float g = hash21(gl_FragCoord.xy + floor(uSeed) * 91.7) - 0.5;
  col += g * GRAIN;

  /* Blend weight of THIS pass. The engine renders adjacent frames as two
     additive passes (A×(1−f) + B×f) — the classic crossfade. */
  col *= uAlpha;
  fragColor = vec4(max(col, vec3(0.0)), 1.0);
}`;

  let prog = buildProgram(gl, VERT, FRAG);
  gl.useProgram(prog);
  gl.uniform1i(gl.getUniformLocation(prog, 'uTex'), 0);
  gl.bindVertexArray(createFilmGeometry(gl));

  const U = {};
  for (const name of ['uCanvas', 'uOffset', 'uDisp', 'uFade', 'uAlpha',
                      'uTime', 'uAmbient', 'uMotion', 'uSeed']) {
    U[name] = gl.getUniformLocation(prog, name);
  }
  let anis = gl.getExtension('EXT_texture_filter_anisotropic');
  const ANIS_MAX = anis
    ? Math.min(4, gl.getParameter(anis.MAX_TEXTURE_MAX_ANISOTROPY_EXT)) : 0;
  /* WEBGL_lose_context must be fetched while the context is alive: a LOST
     context returns null for every getExtension(), so the restore path has
     to keep this handle from boot. */
  const loseCtxExt = gl.getExtension('WEBGL_lose_context');

  gl.viewport(0, 0, 1, 1);   // set properly at first composition

  /* ------------------------- COMPOSITION CACHE --------------------------- */
  /* Everything viewport-dependent lives here; recomputed on resize only. */
  const comp = {
    cw: 1, ch: 1, dpr: 1,
    dispW: 0, dispH: 0, offX: 0, offY: 0,
    marginX: 0, marginY: 0,
    fadeX: 0, fadeY: 0,
    extends: false,
    uploadW: 1800,
    budgetBytes: 440 * 1024 * 1024,
  };

  function computeComposition() {
    const cssW = Math.max(1, window.innerWidth);
    const cssH = Math.max(1, window.innerHeight);
    const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.DPR_CAP);
    const cw = Math.round(cssW * dpr);
    const ch = Math.round(cssH * dpr);
    if (cw === comp.cw && ch === comp.ch) return false;
    comp.cw = cw; comp.ch = ch; comp.dpr = dpr;
    if (canvas.width !== cw || canvas.height !== ch) {
      canvas.width = cw; canvas.height = ch;
    }

    /* Contain scale: the plate is never cropped. */
    const s = Math.min(cw / SRC_W, ch / SRC_H);
    comp.dispW = Math.max(1, Math.round(SRC_W * s));
    comp.dispH = Math.max(1, Math.round(SRC_H * s));

    comp.marginX = Math.max(0, cw - comp.dispW);
    comp.marginY = Math.max(0, ch - comp.dispH);
    comp.fadeX = clamp(comp.marginX * CONFIG.EDGE_FADE_RATIO,
                       CONFIG.EDGE_FADE_MIN, CONFIG.EDGE_FADE_MAX);
    comp.fadeY = clamp(comp.marginY * CONFIG.EDGE_FADE_RATIO,
                       CONFIG.EDGE_FADE_MIN, CONFIG.EDGE_FADE_MAX);
    comp.extends = comp.marginX > 1 || comp.marginY > 1;

    /* The plate is displayed at `dispW` device px — decode to exactly that
       (1:1 sampling, no oversampling / no undersampling). */
    const cap = isMobileLike ? CONFIG.UPLOAD_CAP_MOBILE : CONFIG.UPLOAD_CAP_DESKTOP;
    comp.uploadW = clamp(Math.ceil(Math.min(comp.dispW, SRC_W) / 4) * 4, 640, cap);

    comp.budgetBytes =
      (isMobileLike ? CONFIG.BUDGET_MB_MOBILE : CONFIG.BUDGET_MB_DESKTOP) * 1024 * 1024;

    gl.viewport(0, 0, cw, ch);
    gl.uniform2f(U.uCanvas, cw, ch);
    return true;
  }

  /* Vertical placement of the band: anchored to the subject, not letterboxed. */
  function bandOffset(fIdx) {
    const anc = bandAnchorY(fIdx);
    const offY = clamp(comp.ch * anc - comp.dispH * CONFIG.SUBJECT_BAND_Y,
                       0, comp.marginY);
    return { offX: Math.round((comp.cw - comp.dispW) / 2), offY: Math.round(offY) };
  }

  /* ----------------------------- TEXTURE POOL ---------------------------- */
  const textures = new Map();     // i -> { tex, bytes, lastUse }
  let textureBytes = 0;
  let glLost = false;

  const bytesFor = (w, h) => w * h * 4 * 1.34;   // +mip chain

  function makeTexture(bitmap) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    if (anis) gl.texParameterf(gl.TEXTURE_2D, anis.TEXTURE_MAX_ANISOTROPY_EXT, ANIS_MAX);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, bitmap);
    gl.generateMipmap(gl.TEXTURE_2D);
    return tex;
  }

  function cacheTexture(i, bitmap) {
    if (glLost) return;                       /* context died mid-decode */
    if (textures.has(i)) dropTexture(i);
    const bytes = bytesFor(bitmap.width, bitmap.height);
    textures.set(i, { tex: makeTexture(bitmap), bytes, lastUse: performance.now() });
    textureBytes += bytes;
    trimCache();
    needsDraw = true;
  }

  function dropTexture(i) {
    const e = textures.get(i);
    if (!e) return;
    gl.deleteTexture(e.tex);
    textureBytes -= e.bytes;
    textures.delete(i);
  }

  /* LRU eviction under the byte budget; distance from the playhead dominates.
     `needBytes`, when given, makes the cache admit that frame: it evicts the
     farthest-from-playhead entries until the frame fits (the cache must never
     block loading). */
  function trimCache(needBytes = 0) {
    const a = Math.floor(fIdxSmoothed);
    while (needBytes + textureBytes > comp.budgetBytes * 1.02 && textures.size > 2) {
      let worstI = -1, worstScore = -Infinity;
      for (const [i, e] of textures) {
        const score = Math.abs(i - a) * 1e12 + e.lastUse;
        if (score > worstScore) { worstScore = score; worstI = i; }
      }
      /* never flush the playhead pair when just trimming; a forced admission
         may touch them, but only as a last resort */
      if (worstI < 0) break;
      if (needBytes === 0 && Math.abs(worstI - a) <= 1) break;
      dropTexture(worstI);
    }
  }

  /* ------------------------------ DECODER -------------------------------- */
  const decodeFailed = new Set();

  async function decodeFrame(i) {
    if (textures.has(i) || glLost) return false;
    try {
      const blob = await (await fetch(frameUrl(i))).blob();
      /* A context loss during decode/decode-along is TRANSIENT: returning
         false without touching decodeFailed, so the post-restore re-warm
         picks the frame up again. */
      if (glLost) return false;
      const bitmap = await decodeBlob(blob, comp.uploadW);
      if (glLost) { bitmap.close(); return false; }
      cacheTexture(i, bitmap);
      bitmap.close();
      return true;
    } catch (err) {
      /* network/format failures are permanent for this session */
      decodeFailed.add(i);
      console.warn(`frame ${i + 1} unavailable:`, err && err.message);
      return false;
    }
  }

  async function decodeBlob(blob, targetW) {
    const rw = clamp(Math.round(targetW / 4) * 4, 512, SRC_W);
    const rh = Math.max(2, Math.round(SRC_H * (rw / SRC_W) / 4) * 4);
    try {
      return await createImageBitmap(blob, {
        resizeWidth: rw, resizeHeight: rh, resizeQuality: 'high',
      });
    } catch {
      /* older browsers without decode-time resize */
      const full = await createImageBitmap(blob);
      if (full.width <= rw) return full;
      const oc = new OffscreenCanvas(rw, rh);
      const ctx = oc.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(full, 0, 0, rw, rh);
      full.close();
      return oc.transferToImageBitmap();
    }
  }

  /* ----------------------------- PREFETCHER ------------------------------
     Direction-aware spiral from the playhead: the next frames in the scroll
     direction load first, then the rest. Two lanes; bounded by the budget. */
  let lanes = 0;
  let dirBias = 1;
  const scheduled = new Set();

  function prefetchPump() {
    if (glLost) return;
    while (lanes < CONFIG.PREFETCH_LANES) {
      const next = pickPrefetch();
      if (next < 0) break;
      scheduled.add(next);
      lanes++;
      decodeFrame(next).then((ok) => {
        lanes--;
        scheduled.delete(next);
        if (running) prefetchMicrotask();
      });
    }
  }
  const prefetchMicrotask = () => queueMicrotask(prefetchPump);

  function pickPrefetch() {
    const a = Math.floor(fIdxSmoothed);
    /* Bounded, direction-aware window: bias side first (the next scroll),
       then the reverse side (so flipping direction never waits). Once the
       window is resident the prefetcher goes silent — no idle churn and no
       pointless network traffic. */
    const fwd = dirBias >= 0;
    const leadSpan = fwd ? CONFIG.PREFETCH_AHEAD : CONFIG.PREFETCH_BEHIND;
    const tailSpan = fwd ? CONFIG.PREFETCH_BEHIND : CONFIG.PREFETCH_AHEAD;
    const order = [a];
    for (let t = 1; t <= leadSpan; t++) order.push(a + t * dirBias);
    for (let t = 1; t <= tailSpan; t++) order.push(a - t * dirBias);
    const need = bytesFor(comp.uploadW, Math.round(SRC_H * (comp.uploadW / SRC_W)));
    for (const i of order) {
      if (i < 0 || i >= N) continue;
      if (textures.has(i) || scheduled.has(i) || decodeFailed.has(i)) continue;
      /* The cache must never deadlock: evict until this frame fits. */
      trimCache(need);
      if (need + textureBytes > comp.budgetBytes * 1.02) return -1;
      return i;
    }
    return -1;
  }

  /* ------------------------------ SCROLL RIG -----------------------------
     Native scroll over a spacer track. The track is always
     `clientHeight + travel` tall, so the film's scroll range stays constant
     across browser-chrome transitions (iOS toolbar collapse cancels out). */
  const travel = () =>
    clamp(window.innerHeight * CONFIG.SCROLL_DIST_VH,
          CONFIG.SCROLL_DIST_MIN, CONFIG.SCROLL_DIST_MAX);

  function sizeTrack() {
    const clientH = document.documentElement.clientHeight || window.innerHeight;
    track.style.height = `${clientH + travel()}px`;
  }
  let maxScroll = 1;
  const refreshMaxScroll = () => {
    maxScroll = Math.max(1, document.documentElement.scrollHeight -
                             document.documentElement.clientHeight);
  };

  let fIdxTarget = 0;
  let fIdxSmoothed = 0;

  function readScroll() {
    const p = clamp(Math.max(0, scrollY) / maxScroll, 0, 1);
    fIdxTarget = p * (N - 1);
    return p;
  }

  /* ------------------------------- DRAW ---------------------------------- */
  let needsDraw = true;
  let running = false;
  let ambientClock = 0;
  let draws = 0;

  const activity = ['scroll', 'wheel', 'touchstart', 'touchmove', 'keydown',
                    'pointerdown', 'resize'];
  let lastActivity = performance.now();
  const touch = () => { lastActivity = performance.now(); };
  for (const ev of activity) addEventListener(ev, touch, { passive: true });

  let lastT = performance.now();

  function tick(now) {
    if (!running) return;
    requestAnimationFrame(tick);
    const dt = Math.min(0.1, Math.max(0.001, (now - lastT) / 1000));
    lastT = now;

    readScroll();

    /* frame-rate-independent exponential approach — smooth and reversible */
    const k = 1 - Math.exp(-dt * (reducedMotion ? 22 : CONFIG.SMOOTH_LAMBDA));
    fIdxSmoothed += (fIdxTarget - fIdxSmoothed) * k;

    if (Math.abs(fIdxTarget - fIdxSmoothed) > 0.25) {
      dirBias = Math.sign(fIdxTarget - fIdxSmoothed) || 1;
    }

    /* ambient clock: freezes when the user stops, to save power
       (and freezes entirely under reduced-motion) */
    const idleMs = now - lastActivity;
    if (!reducedMotion && idleMs < CONFIG.IDLE_FREEZE_MS) ambientClock += dt * 0.35;

    prefetchPump();
    trimCache();   /* eviction never depends on a successful draw */

    const settled = Math.abs(fIdxTarget - fIdxSmoothed) < CONFIG.SETTLE_EPSILON;
    if (needsDraw || !settled) {
      drawFrame();
      needsDraw = false;
    }
  }

  const DEBUG = new URLSearchParams(location.search).has('debug');

  function drawFrame() {
    if (glLost) return;
    if (DEBUG) draws++;
    const f = clamp(fIdxSmoothed, 0, N - 1);
    const i0 = Math.floor(f);
    const i1 = Math.min(N - 1, i0 + 1);
    const frac = f - i0;

    const a = nearestLoaded(i0);
    const b = i1 !== i0 ? nearestLoaded(i1) : -1;
    if (a < 0 && b < 0) return;               /* nothing decoded yet */

    const off = bandOffset(f);
    gl.uniform2f(U.uOffset, off.offX, off.offY);
    gl.uniform2f(U.uDisp, comp.dispW, comp.dispH);
    gl.uniform2f(U.uFade, comp.fadeX, comp.fadeY);
    gl.uniform1f(U.uTime, ambientClock);
    gl.uniform1f(U.uAmbient, comp.extends ? 1 : 0);
    gl.uniform1f(U.uMotion, reducedMotion ? 0 : 1);
    gl.uniform1f(U.uSeed, Math.floor(ambientClock * 60) % 4096);

    const pass = (texIdx, alpha) => {
      const e = textures.get(texIdx);
      if (!e || alpha <= 0.002) return;
      gl.bindTexture(gl.TEXTURE_2D, e.tex);
      gl.uniform1f(U.uAlpha, alpha);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    };

    if (b >= 0 && b !== a) {
      gl.disable(gl.BLEND);
      pass(a, 1 - frac);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE);           /* unread alpha: additive lift */
      pass(b, frac);
      gl.disable(gl.BLEND);
    } else {
      gl.disable(gl.BLEND);
      pass(a, 1);
    }
  }

  function nearestLoaded(i) {
    if (i < 0 || i >= N) return -1;
    if (textures.has(i)) return i;
    for (let r = 1; r <= 8; r++) {
      if (textures.has(i + r)) return i + r;
      if (textures.has(i - r)) return i - r;
    }
    return -1;
  }

  /* ------------------------------ RESIZE --------------------------------- */
  let resizeTimer = 0;
  function onResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      sizeTrack();
      refreshMaxScroll();
      if (computeComposition()) trimCache();
      needsDraw = true;
    }, 90);
  }
  addEventListener('resize', onResize, { passive: true });
  addEventListener('orientationchange', onResize, { passive: true });
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', onResize, { passive: true });
  }

  /* --------------------------- CONTEXT LOSS ------------------------------
     Devices under memory pressure can drop the GL context. After a restore,
     every GL object is invalid — the program, geometry and sampler bindings
     must be rebuilt, then the playhead neighbourhood re-warms. */
  canvas.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    glLost = true;
    for (const i of [...textures.keys()]) dropTexture(i);
    textureBytes = 0;
  }, false);

  canvas.addEventListener('webglcontextrestored', () => {
    glLost = false;
    /* In-flight decodes resolved against the lost context: purge any entries
       they inserted and clear scheduling so the window re-warms cleanly. */
    scheduled.clear();
    for (const i of [...textures.keys()]) dropTexture(i);
    textureBytes = 0;
    prog = buildProgram(gl, VERT, FRAG);
    gl.useProgram(prog);
    gl.uniform1i(gl.getUniformLocation(prog, 'uTex'), 0);
    gl.bindVertexArray(createFilmGeometry(gl));
    for (const name of Object.keys(U)) U[name] = gl.getUniformLocation(prog, name);
    anis = gl.getExtension('EXT_texture_filter_anisotropic');
    gl.viewport(0, 0, comp.cw, comp.ch);
    gl.uniform2f(U.uCanvas, comp.cw, comp.ch);
    needsDraw = true;
  }, false);

  /* ------------------------------- BOOT ---------------------------------- */
  async function boot() {
    computeComposition();
    sizeTrack();
    refreshMaxScroll();

    /* Boot ring: the first frames, decoded before the reveal. Lanes advance
       by stride so the same frame is never decoded twice in parallel; the bar
       counts a fixed total so it moves monotonically. */
    const total = CONFIG.BOOT_RING + 1;
    const bootLanes = CONFIG.PREFETCH_LANES + 1;
    let ready = 0;

    const setBar = () => {
      bootBar.style.width = `${clamp(ready / total * 100, 8, 100)}%`;
    };

    const loadLane = async (lane) => {
      for (let i = lane; i < total; i += bootLanes) {
        if (!textures.has(i)) await decodeFrame(i);
        ready++;
        setBar();
      }
    };
    await Promise.all(Array.from({ length: bootLanes }, (_, l) => loadLane(l)));

    /* Reveal: canvas fades in over the black veil, then the veil removes. */
    canvas.style.opacity = '1';
    bootVeil.classList.add('done');
    setTimeout(() => bootVeil.remove(), 700);

    running = true;
    lastT = performance.now();
    requestAnimationFrame(tick);
    prefetchPump();
  }

  boot();

  /* ------------------------------- DEBUG --------------------------------- */
  if (DEBUG) {
    window.__film = {
      snapshot() {
        const f = fIdxSmoothed;
        const off = bandOffset(f);
        return {
          index: +f.toFixed(4), target: +fIdxTarget.toFixed(4),
          decoded: textures.size,
          cached: [...textures.keys()].sort((x, y) => x - y),
          textureMB: +(textureBytes / 1048576).toFixed(1),
          budgetMB: +(comp.budgetBytes / 1048576).toFixed(0),
          uploadW: comp.uploadW, disp: [comp.dispW, comp.dispH],
          off: [off.offX, off.offY],
          canvas: [canvas.width, canvas.height],
          scroll: [scrollY, maxScroll],
          draws, lanes: scheduled.size,
          motion: reducedMotion ? 0 : 1,
          glLost,
          decodeFailed: decodeFailed.size,
          failed: [...decodeFailed],
        };
      },
      draw: drawFrame,
      seek(v) { fIdxSmoothed = v; fIdxTarget = v; },
      /* Same-task readback: valid only immediately after a draw */
      readback(x, y) {
        const b = new Uint8Array(4);
        gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, b);
        return [b[0], b[1], b[2]];
      },
      dims: () => [canvas.width, canvas.height],
      loseContext() {
        if (loseCtxExt) loseCtxExt.loseContext();
        return !!loseCtxExt;
      },
      restoreContext() {
        if (loseCtxExt) loseCtxExt.restoreContext();
        return !!loseCtxExt;
      },
    };
  }
}

/* -------------------- GL program helper ---------------------------------- */
/* Fullscreen-triangle geometry, bound as a VAO. Rebuilt after context loss. */
function createFilmGeometry(glCtx) {
  const vao = glCtx.createVertexArray();
  glCtx.bindVertexArray(vao);
  const buf = glCtx.createBuffer();
  glCtx.bindBuffer(glCtx.ARRAY_BUFFER, buf);
  glCtx.bufferData(glCtx.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), glCtx.STATIC_DRAW);
  glCtx.enableVertexAttribArray(0);
  glCtx.vertexAttribPointer(0, 2, glCtx.FLOAT, false, 0, 0);
  return vao;
}

function buildProgram(glCtx, vsSrc, fsSrc) {
  const compile = (type, src) => {
    const s = glCtx.createShader(type);
    glCtx.shaderSource(s, src);
    glCtx.compileShader(s);
    if (!glCtx.getShaderParameter(s, glCtx.COMPILE_STATUS)) {
      throw new Error('Shader: ' + glCtx.getShaderInfoLog(s));
    }
    return s;
  };
  const p = glCtx.createProgram();
  glCtx.attachShader(p, compile(glCtx.VERTEX_SHADER, vsSrc));
  glCtx.attachShader(p, compile(glCtx.FRAGMENT_SHADER, fsSrc));
  glCtx.linkProgram(p);
  if (!glCtx.getProgramParameter(p, glCtx.LINK_STATUS)) {
    throw new Error('Link: ' + glCtx.getProgramInfoLog(p));
  }
  return p;
}
