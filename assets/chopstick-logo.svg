<svg xmlns="http://www.w3.org/2000/svg" viewBox="45 8 1035 310" role="img" aria-labelledby="title desc">
  <title id="title">Chopstick Integrations</title>
  <desc id="desc">Transparent glass-effect CHOPSTICK wordmark crossed by two red chopsticks, with INTEGRATIONS beneath.</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" offset="0"/>
      <stop stop-color="#bdb5b8" offset=".42"/>
      <stop stop-color="#f8eeee" offset=".62"/>
      <stop stop-color="#aaa0a4" offset="1"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#6e0718"/>
      <stop stop-color="#ff2949" offset=".48"/>
      <stop stop-color="#ffc0ca" offset="1"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <text x="55" y="207" fill="url(#glass)" stroke="#e8dfe0" stroke-width=".7" paint-order="stroke" font-family="Arial,Helvetica,sans-serif" font-size="154" font-weight="300" letter-spacing="9">CHOPSTICK</text>
  <g filter="url(#glow)" stroke="url(#red)" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M362 291 611 30"/>
    <path d="M384 310 632 62"/>
  </g>
  <g stroke="#ffd8de" stroke-width="1.5" opacity=".85" fill="none">
    <path d="M362 291 611 30 602 34"/>
    <path d="M384 310 632 62 621 65"/>
  </g>
  <text x="485" y="286" fill="url(#glass)" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="300" letter-spacing="25">INTEGRATIONS</text>
</svg>